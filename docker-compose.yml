services:
  app:
    build: .
    ports:
      - "3000:3000"
    # Read when the container starts, so secrets are never baked into the image.
    env_file: .env.local
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
