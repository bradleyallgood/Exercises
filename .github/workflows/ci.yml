name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Placeholders: the build imports these modules but never connects.
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
          BETTER_AUTH_SECRET: placeholder-secret-for-ci-build-only
          BETTER_AUTH_URL: http://localhost:3000
